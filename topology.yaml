# Repo topology — machine-readable form of topology.md.
#
# This file is the manifest the RVND topology gate reads; topology.md is its
# rationale. Every plane, repo, role, and edge asserted here mirrors topology.md:
# three planes (ctrl orchestrates, rvnd enforces, loomground grounds) and the
# arrow-rules — dependencies point one way, toward the base: ctrl may depend on
# rvnd and loomground; rvnd depends on loomground (it is a seam built on the
# loomground base); verticals depend only on the RVND engine; and nothing
# depends backwards — loomground never depends on rvnd or ctrl, and nothing
# depends back on ctrl.
#
# This file is THIS WORKSPACE'S INSTANCE of the shared, portable topology
# manifest schema — see topology.schema.md (same directory) for the normative,
# engine-agnostic field-by-field spec (version, planes[], repos[],
# allowed_edges/denied_edges, the optional scan block) this instance fills in.
# The core role vocabulary there (root/leaf/shared/boundary) is portable; the
# roles used below (engine, vertical, oversight, ...) are this instance's own
# adopter-role layer, named in topology.schema.md purely as an example.
#
# Restricted-subset YAML: plain scalars, lists of maps only. No anchors,
# aliases, or folded/multiline blocks, so a dependency-free loader can read it.
version: 1

planes:
  - id: ctrl
    name: Orchestration
  - id: rvnd
    name: Governance
  - id: loomground
    name: Knowledge

repos:
  # Orchestration plane — ctrl (the outer ring; consumes the other two).
  - id: ctrl-engineering
    plane: ctrl
    role: core
    packages: [ctrl-engineering, ctrl_engineering]
  - id: ctrl-arena
    plane: ctrl
    role: mode
    packages: [ctrl-arena, ctrl_arena]
  - id: ctrl-panel
    plane: ctrl
    role: mode
    packages: [ctrl-panel, ctrl_panel]
  - id: ctrl-build-arena
    plane: ctrl
    role: mode
    packages: [ctrl-build-arena, ctrl_build_arena]

  # Governance plane — RVND (one engine plus a fan of verticals that depend on it).
  - id: RVND
    plane: rvnd
    role: engine
    packages: [rvnd]
  - id: rvnd-oversight
    plane: rvnd
    role: oversight
    packages: [rvnd-oversight, rvnd_oversight]
  - id: rvnd-music
    plane: rvnd
    role: vertical
    packages: [rvnd-music, rvnd_music]
  - id: rvnd-judiciary
    plane: rvnd
    role: vertical
    packages: [rvnd-judiciary, rvnd_judiciary]
  - id: rvnd-education
    plane: rvnd
    role: vertical
    packages: [rvnd-education, rvnd_education]
  - id: rvnd-employment
    plane: rvnd
    role: vertical
    packages: [rvnd-employment, rvnd_employment]
  - id: rvnd-family
    plane: rvnd
    role: vertical
    packages: [rvnd-family, rvnd_family]
  - id: rvnd-pack
    plane: rvnd
    role: pack
    packages: [rvnd-pack, rvnd_pack]

  # Knowledge plane — Loomground (representative members, not exhaustive).
  - id: versum
    plane: loomground
    role: substrate
    packages: [versum]
  - id: loomground-governance
    plane: loomground
    role: substrate
    packages: [loomground-governance, loomground_governance]
  - id: loomground-writing
    plane: loomground
    role: editorial
    packages: [loomground-writing, loomground_writing]
  - id: loomground-plugins
    plane: loomground
    role: marketplace
    packages: [loomground-plugins, loomground_plugins]

# The three permitted dependency directions (topology.md arrow-rules 1 and 2).
# Anything not listed here is denied by default.
allowed_edges:
  - from_plane: ctrl
    to_plane: rvnd
  - from_plane: ctrl
    to_plane: loomground
  # rvnd is a governance seam built on the loomground base (pins loomground pkgs).
  - from_plane: rvnd
    to_plane: loomground
  - from_role: vertical
    to_role: engine
  # Intra-plane edges are fine: a plane's repos may depend on each other (ctrl
  # modes on the ctrl core; loomground index/editorial on the loomground base).
  # Evaluated allowed-before-denied, so these override the broad ctrl deny below
  # for INTRA-ctrl edges while cross-plane ...->ctrl stays denied. (rvnd intra-plane
  # is intentionally NOT blanket-allowed: it stays governed by the specific
  # vertical->engine allow above + the vertical->vertical deny below.)
  - from_plane: ctrl
    to_plane: ctrl
  - from_plane: loomground
    to_plane: loomground

# Explicit prohibitions, made human-legible (topology.md arrow-rules 1, 2, 3).
# Same key vocabulary as allowed_edges: from_plane/to_plane/from_role/to_role.
denied_edges:
  # Loomground is the base — it never depends backwards on rvnd (rvnd -> loomground
  # is allowed above; only the reverse is a violation).
  - from_plane: loomground
    to_plane: rvnd
  # Nothing depends back on ctrl (covers loomground -> ctrl and rvnd -> ctrl).
  - to_plane: ctrl
  # Verticals are not peers — no vertical depends on another vertical.
  - from_role: vertical
    to_role: vertical

# How repos are discovered on disk (topology.schema.md "scan"). Root is
# relative to THIS file's own directory, resolving to the Projects/ workspace
# root one level up — equal to the checker's own hardcoded default, made
# explicit here so the manifest is self-contained instead of leaning on that
# hardcoded assumption. max_depth matches the checker's existing default.
#
# skip_dirs may only ADD to the checker's own hardcoded VCS/build denylist
# floor, never remove from it; each entry here narrows what is scanned, so
# each carries a reason, per topology.schema.md "Named review". Skillguild is
# the one repo-looking directory directly under the workspace root that is
# genuinely outside this topology's three-plane scope (not a ctrl/RVND/
# Loomground repo at all) — everything else this checker would otherwise flag
# as undeclared lives nested deeper than the scan's undeclared-repo check
# looks, so no further exemption is needed for it to stay clean.
scan:
  root: ".."
  max_depth: 3
  skip_dirs:
    - name: Skillguild
      reason: "a separate product outside this instance's three-plane (ctrl/RVND/Loomground) topology scope; not governed by this manifest"
    - name: topology-boundary
      reason: "the extracted universal-product package (its own repo-to-be), not part of this workspace's three-plane topology; its test fixtures also contain repo-name dirs (ctrl-engineering/rvnd-*) that would false-match this instance's discovery"
    # Domain-product / vertical / program / grounding-moat layer — built ON the
    # three planes, not part of the core ctrl/RVND/Loomground plane infrastructure
    # this manifest governs (same class as Skillguild). Skipped for now, not
    # declared: promote each to a governed repos[] entry (plane + role + engine
    # edges) once the topology owner confirms its plane membership — declaring
    # blindly would assert dependency edges that may be wrong or that would fail
    # the gate (e.g. loomground-reasoner already pins cross-plane packages).
    - name: corporate-transactions
      reason: "M&A legal vertical (loomground-grounded skill product) built on the planes, not plane infrastructure"
    - name: ctrl-legal
      reason: "ctrl:legal — a legal application built on the ctrl plane (router/shadow), not core ctrl plane infrastructure"
    - name: digital-law
      reason: "Digital Law spine — legal skills on the legal-navigator engine; a domain product built on the planes"
    - name: digital-law-ai
      reason: "Digital Law AI-governance skill (domain product), not plane infrastructure"
    - name: digital-law-data-protection
      reason: "Digital Law data-protection skill (domain product), not plane infrastructure"
    - name: legal-department-program
      reason: "auditable legal-department program — an audit spine ABOVE the three planes, not a plane repo"
    - name: legal-topology-grammar
      reason: "legal-topology / topos grounding grammar (a grounding moat), not part of the core three-plane infrastructure"
    - name: loomground-reasoner
      reason: "loomground reasoning component that currently pins cross-plane packages; declare + govern once its plane edges are clean rather than fail the gate"
    - name: music-rights
      reason: "Music-Rights-Law (mrl) vertical profile + nD system (grounded product) built on the planes"
    - name: _local
      reason: "local ops working area (per-session worktrees, tools, ingest/isolation notices) — git-ignored, not a repo of any plane"
    - name: skill-governance-block
      reason: "vendor-neutral cross-cutting spec (a frontmatter binding of the Loomground governance language) consumed by all three planes; not a repo of one plane"
